
upstream alzahra_unix_sock {
    server unix:///usr/share/nginx/socks/alzahra.sock;
}

server {
    listen 80;

    # listen 443 ssl http2;
    # ssl_certificate /root/.acme.sh/gooje.app_ecc/fullchain.cer;
    # ssl_certificate_key /root/.acme.sh/gooje.app_ecc/gooje.app.key;

    server_name z1.00-team.org;
    charset utf-8;

    client_max_body_size 50M;
    error_page 404 /;
    error_page 403 /;

    location / {
        proxy_set_header Forwarded $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-Ip $remote_addr;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        proxy_pass http://alzahra_unix_sock;
    }
}
